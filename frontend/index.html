<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link  rel="icon" href="images/header-logo.png" type="image/png">
        <title>News Platform || Main Page</title>
        <link rel="stylesheet" href="css/output.css">
        <style>
            #create_div {
                min-width: 20rem;
            }

            #create-article-msg {
                width: 100%;
                margin-top: 0;
                padding: 0 1rem;
                max-height: 0;
                opacity: 0;
                overflow: hidden;
                transform: translateY(-10px) scale(0.98);
                transform-origin: top center;
                transition:
                    max-height 240ms ease,
                    opacity 220ms ease,
                    transform 240ms cubic-bezier(0.22, 1, 0.36, 1),
                    margin-top 240ms ease,
                    padding 240ms ease;
            }

            #create-article-msg.is-visible {
                margin-top: 0.85rem;
                padding: 0.75rem 1rem;
                max-height: 5rem;
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        </style>
    </head>
    <body class=" min-h-screen">
        <header class="relative p-2 bg-[#00E0AC] flex items-center justify-center">
            <!-- Centered logo -->
            <a href="index.html">
                <img 
                    src="images/meddle- logo.png"
                    class="w-32 h-16 object-contain"
                    alt="Meddle logo"
                />
            </a>
            <!-- Logout button on far right -->
            <button
                id="logout-btn"
                class="absolute right-4 px-3 py-1 bg-red-500 text-white text-sm rounded hover:bg-red-600 hidden"
            >
                Logout
            </button>
        </header>
        <section class="flex flex-col justify-center p-4">
            <div class="flex flex-col justify-center mx-auto">
                <h1 class="text-3xl font-bold mb-4">Welcome to the News Platform</h1>
                <p class="mb-2">Stay updated with the latest news articles from around the world.</p>
            </div>
            <div class="mx-auto text-gray-500" id="auth-status">
                <p>You are not logged in. 
                    <a href="pages/register.html" class=" cursor-pointer text-blue-500">Register</a>
                        or <a href="pages/login.html" class=" cursor-pointer text-blue-500">Sign In</a></p>
            </div>
            <div id="create_div" class="mx-auto mt-4 flex flex-col items-center">
                <button
                    id="create-article-btn"
                    class="text-white px-3 cursor-pointer py-1 rounded-md bg-[#00E0AC] hover:bg-[#00C89F]">
                    Create Article
                </button>
                <span 
                id="create-article-msg"
                class="rounded-xl border border-[#00E0AC] bg-white/85 text-sm font-medium text-[#1B0D6F] shadow-sm backdrop-blur-sm">You are not logged in. Sign in to create an article.</span>
            </div>
        </section>
        <main>
            <section class="ml-4 p-4">
                <h2 class="text-2xl font-semibold mb-4">Latest News Articles</h2>
                <div id="articles-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- News articles will be dynamically inserted here -->
                </div>
            </section>
            <div class="flex justify-center mb-4">
                <button id="load-more-btn" class="bg-[#00E0AC] text-xl rounded-md px-3 py-2 text-blue-500 font-semibold cursor-pointer">Load More</button>
            </div>
        </main>
        <footer>
            <div class="bg-[#00E0AC] text-center p-4 mt-4">
                <p class="text-sm text-gray-700">&copy; 2024 News Platform. All rights reserved.</p>
            </div>
        </footer>
        <script src="js/main.js" type="module"></script>
    </body>
</html>
