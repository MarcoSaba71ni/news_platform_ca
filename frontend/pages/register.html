<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Register Page Meddle" />
  <link  rel="icon" href="../images/header-logo.png" type="image/png">
  <title>Register || Meddle</title>
  <link rel="stylesheet" href="../css/output.css">
</head>

<body class="min-h-screen flex flex-col items-center justify-center bg-[#00E0AC] text-[#1B0D6F] font-sans text-center">

  <!-- Logo -->
  <nav>
    <img
      src="../images/meddle- logo.png"
      alt="Meddle logo"
      class="mx-auto w-70"
    />
  </nav>

<main class="w-full max-w-md">
  <h1 class="text-3xl font-bold mb-2">Register</h1>
  <p class="mb-4">If you already have an account, <a class="underline" href="login.html">Sign In</a></p>

    <form
        id="register-form"
        class="flex flex-col gap-4 mx-auto items-center"
    >

        <!-- Username -->
        <div class="w-[300px] flex flex-col">
        <label for="name" class="text-left text-sm">Username</label>
        <input
            type="text"
            name="name"
            id="name"
            placeholder="Write your username"
            class="h-[35px] bg-[#1B0D6F] text-white border border-black rounded-md px-3"
        />
        <span id="name-span" class=" hidden font-semibold text-sm"></span>
        </div>

        <!-- Email -->
        <div class="w-[300px] flex flex-col">
        <label for="email" class="text-left text-sm">Email</label>
        <input
            type="email"
            name="email"
            id="email"
            placeholder="Write your email"
            class="h-[35px] bg-[#1B0D6F] text-white border border-black rounded-md px-3"
        />
        <span id="email-span" class=" hidden font-semibold text-sm"></span>
        </div>

        <!-- Password -->
        <div class="w-[300px] flex flex-col">
        <label for="password" class="text-left text-sm">Password</label>
        <input
            type="password"
            name="password"
            id="password"
            placeholder="Write your password"
            class="h-[35px] bg-[#1B0D6F] text-white border border-black rounded-md px-3"
        />
        <span id="password-span" class=" hidden font-semibold text-sm"></span>
        <span id="general-span" class=" hidden font-semibold text-red-500 text-sm"></span>
        </div>
        <!-- Button -->
        <button
        type="submit"
        id="register-btn"
        class="mt-4 w-auto p-2 rounded-xl text-[22px] bg-[#1B0D6F]
                hover:bg-[#d9d7df] text-white hover:text-[#1B0D6F]
                transition-colors cursor-pointer"
        >
        Register
        </button>
  </form>
</main>
  <script type="module" src="../js/src/register.js"></script>
</body>
</html>
